<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b4ea2">
<title>Smart Shop • Marketplace Regional</title>
<style>
:root{--blue:#0b4ea2;--blue2:#07346f;--orange:#ff7a00;--bg:#f4f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--ok:#16803c;--warn:#a15c00;--danger:#b42318;--shadow:0 10px 30px rgba(15,48,90,.10)}
*{box-sizing:border-box}html,body{margin:0;background:#dde5f0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{width:min(460px,100%);min-height:100vh;margin:auto;background:var(--bg);padding-bottom:82px;box-shadow:0 0 30px rgba(0,0,0,.10)}
.header{background:linear-gradient(145deg,var(--blue2),var(--blue));color:#fff;padding:16px 16px 22px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:10px}.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(145deg,#ff9e1a,#ff7000);display:grid;place-items:center;font-size:27px;font-weight:900}.brand strong{font-size:21px}.brand span{color:var(--orange)}.loc{font-size:11px;opacity:.9;margin-top:3px}.header-actions{display:flex;gap:8px}.iconbtn{width:38px;height:38px;border:0;border-radius:11px;background:rgba(255,255,255,.12);color:#fff;font-size:18px;position:relative}.badge{position:absolute;right:-5px;top:-5px;background:#ff264d;color:#fff;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;font-size:10px;font-weight:800}
.search{margin-top:14px;display:flex;background:#fff;border-radius:14px;padding:0 12px;height:48px;align-items:center;gap:8px}.search input{border:0;outline:0;flex:1;min-width:0}main{padding:14px 14px 100px}.banner{background:linear-gradient(120deg,#106dcc,#0b4ea2);color:#fff;border-radius:20px;padding:18px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;box-shadow:var(--shadow)}.banner h2{margin:0 0 5px}.banner p{margin:0;font-size:12px;line-height:1.45}.pillbig{background:var(--orange);font-size:22px;font-weight:900;border-radius:13px;padding:10px 14px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}.section-head h2{margin:0;font-size:18px}.link{border:0;background:none;color:var(--blue);font-size:12px;font-weight:800;padding:0}
.categories,.stores{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}.cat{min-width:92px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}.cat .emoji{font-size:32px}.cat b{display:block;font-size:11px;margin-top:6px}.store-card{min-width:245px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}.store-logo{width:58px;height:58px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-weight:900;flex:none}.store-logo.tech{background:#102746}.small{font-size:11px;color:var(--muted);margin-top:4px}.star{color:#f3a400}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.product{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);position:relative}.product img{width:100%;height:150px;object-fit:cover;background:#fff;display:block}.prod-body{padding:10px}.prod-body h3{margin:0 0 8px;font-size:13px;line-height:1.3;min-height:34px}.price{font-weight:900;font-size:18px}.old{font-size:10px;color:#8b93a0;text-decoration:line-through;margin-left:4px}.disc{position:absolute;top:8px;left:8px;background:var(--orange);color:#fff;padding:6px 8px;border-radius:10px;font-size:10px;font-weight:900}
.view{display:none}.view.active{display:block}.back{border:0;background:none;color:var(--blue);font-weight:800;padding:0 0 12px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.col{display:grid;gap:8px}.btn{border:0;border-radius:13px;padding:12px 14px;font-weight:900}.btn.primary{background:var(--orange);color:#fff}.btn.blue{background:var(--blue);color:#fff}.btn.light{background:#eef3f9;color:var(--blue)}.btn.danger{background:#feeceb;color:var(--danger)}.btn.w100{width:100%}.btn.sm{padding:8px 10px;font-size:11px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.form label{display:block;font-size:11px;font-weight:800;margin:9px 0 5px}.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.form textarea{min-height:86px}.detail-img{height:270px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:16px;overflow:hidden}.detail-img img{width:100%;height:100%;object-fit:contain}.qty{display:flex;gap:10px;align-items:center}.qty button{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:900}.cart-item{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.cart-item img{width:64px;height:64px;border-radius:10px;object-fit:cover}.total{font-size:18px;font-weight:900}
.status{display:inline-flex;padding:6px 8px;border-radius:999px;font-size:10px;font-weight:900}.s-warn{background:#fff3dd;color:var(--warn)}.s-ok{background:#eaf8ef;color:var(--ok)}.s-blue{background:#e8f2ff;color:var(--blue)}.s-danger{background:#feeceb;color:var(--danger)}.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.role{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;text-align:left}.role .emoji{font-size:28px}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px}.metric small{color:var(--muted)}.metric strong{display:block;font-size:21px;margin-top:4px}.timeline{border-left:2px solid #dbe4ef;margin-left:7px;padding-left:14px}.timeline div{margin:0 0 14px;position:relative}.timeline div:before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--blue)}.notice{background:#fff8e8;border:1px solid #ffe0a3;border-radius:13px;padding:10px;font-size:11px;color:#7a4a00}hr{border:0;border-top:1px solid var(--line);margin:12px 0}
nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(460px,100%);height:76px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:30}nav button{border:0;background:#fff;color:#45505f;font-size:10px}nav button.active{color:var(--blue);font-weight:900}nav .nicon{display:block;font-size:23px;margin-bottom:3px}.modal{position:fixed;inset:0;background:rgba(6,18,35,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(460px,100%);max-height:86vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:16px}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:#172033;color:#fff;border-radius:12px;padding:10px 14px;font-size:12px;z-index:70;display:none}.empty{padding:24px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
<section id="homeView" class="view active"><header class="header"><div class="top"><div class="brand"><div class="logo">S</div><div><strong>SMART <span>SHOP</span></strong><div class="loc">📍 Mateus Leme, MG • marketplace regional</div></div></div><div class="header-actions"><button class="iconbtn" onclick="showView('ordersView')">🔔<span class="badge">2</span></button><button class="iconbtn" onclick="showCart()">🛒<span id="cartBadge" class="badge">0</span></button></div></div><div class="search">🔎 <input id="searchInput" placeholder="Buscar produto, loja ou categoria..." oninput="renderHomeProducts()"></div></header><main><section class="banner"><div><h2>Compre perto. Receba rápido.</h2><p>Lojas locais, retirada, entrega própria ou parceiro Smart Shop.</p></div><div class="pillbig">HOJE</div></section><div class="section-head"><h2>Categorias</h2><button class="link" onclick="openCategory('Todos')">Ver todas</button></div><div id="categories" class="categories"></div><div class="section-head"><h2>Lojas da sua cidade</h2><button class="link" onclick="showView('storesView')">Ver todas</button></div><div id="stores" class="stores"></div><div class="section-head"><h2>Ofertas perto de você</h2><button class="link" onclick="openCategory('Todos')">Ver todas</button></div><div id="homeProducts" class="grid"></div></main></section>
<section id="storesView" class="view"><main><button class="back" onclick="showView('homeView')">← Voltar</button><h2>Lojas</h2><div id="allStores" class="col"></div></main></section>
<section id="categoryView" class="view"><main id="categoryContent"></main></section><section id="storeView" class="view"><main id="storeContent"></main></section><section id="productView" class="view"><main id="productContent"></main></section><section id="cartView" class="view"><main id="cartContent"></main></section><section id="checkoutView" class="view"><main id="checkoutContent"></main></section><section id="ordersView" class="view"><main><button class="back" onclick="showView('homeView')">← Voltar</button><h2>Meus pedidos</h2><div id="ordersContent"></div></main></section><section id="accountView" class="view"><main id="accountContent"></main></section><section id="merchantView" class="view"><main id="merchantContent"></main></section><section id="courierView" class="view"><main id="courierContent"></main></section><section id="adminView" class="view"><main id="adminContent"></main></section><section id="supportView" class="view"><main id="supportContent"></main></section>
<nav><button id="navHome" class="active" onclick="showView('homeView')"><span class="nicon">⌂</span>Início</button><button onclick="openCategory('Todos')"><span class="nicon">▦</span>Categorias</button><button onclick="focusSearch()"><span class="nicon">⌕</span>Buscar</button><button onclick="showView('ordersView')"><span class="nicon">▣</span>Pedidos</button><button onclick="showView('accountView')"><span class="nicon">♙</span>Conta</button></nav>
</div><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div id="sheet" class="sheet"></div></div><div id="toast" class="toast"></div>
<script>
const IMG={bolsa:"https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=900&q=80",jeans:"https://images.unsplash.com/photo-1542272604-787c3835535d?auto=format&fit=crop&w=900&q=80",vestido:"https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=900&q=80",tenis:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=900&q=80",fone:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=900&q=80"};
const seed={stores:[{id:"bella",name:"Bella Moda",initials:"BM",category:"Moda",rating:4.9,desc:"Moda feminina e acessórios",delivery:["pickup","store","smart"]},{id:"tech",name:"Store Tech",initials:"ST",category:"Eletrônicos",rating:4.8,desc:"Tecnologia e acessórios",delivery:["pickup","smart"]}],products:[{id:"p1",storeId:"bella",name:"Bolsa Feminina",category:"Moda",price:119.90,oldPrice:139.90,stock:20,img:IMG.bolsa,desc:"Bolsa feminina elegante para uso diário.",active:true},{id:"p2",storeId:"bella",name:"Calça Jeans Feminina Wide Leg",category:"Moda",price:64.90,oldPrice:79.90,stock:36,img:IMG.jeans,desc:"Calça jeans wide leg confortável.",active:true},{id:"p3",storeId:"bella",name:"Vestido Midi Modelador",category:"Moda",price:61.74,oldPrice:119.90,stock:25,img:IMG.vestido,desc:"Vestido midi elegante para festa e passeio.",active:true},{id:"p4",storeId:"tech",name:"Tênis Esportivo",category:"Calçados",price:159.90,oldPrice:199.90,stock:20,img:IMG.tenis,desc:"Tênis esportivo confortável para uso diário.",active:true},{id:"p5",storeId:"tech",name:"Fone Bluetooth Pro",category:"Eletrônicos",price:129.90,oldPrice:159.90,stock:12,img:IMG.fone,desc:"Fone bluetooth com estojo carregador.",active:true}],user:{name:"Josiane Rodrigues",email:"cliente@smartshop.demo",phone:"(31) 99999-0000",address:"Rua Virgílio Guimarães, 350 - Santa Bárbara",city:"Mateus Leme/MG"},cart:[],orders:[],favorites:[],merchantApplications:[],courierApplications:[],tickets:[],courier:{online:false,name:"Entregador Demo",balance:0,acceptedOffer:null},coupons:{SMART10:{type:"percent",value:10,min:50}}};
const KEY="smartshop_demo_v3";let state=load();function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x?{...seed,...x}:structuredClone(seed)}catch{return structuredClone(seed)}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function money(v){return Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.style.display="block";setTimeout(()=>t.style.display="none",2200)}function storeById(id){return state.stores.find(s=>s.id===id)}function productById(id){return state.products.find(p=>p.id===id)}
function showView(id){document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));if(id==="homeView")document.getElementById("navHome").classList.add("active");window.scrollTo(0,0);if(id==="ordersView")renderOrders();if(id==="accountView")renderAccount();if(id==="merchantView")renderMerchant();if(id==="courierView")renderCourier();if(id==="adminView")renderAdmin();if(id==="supportView")renderSupport()}function focusSearch(){showView("homeView");setTimeout(()=>document.getElementById("searchInput").focus(),50)}function pct(p){if(!p.oldPrice||p.oldPrice<=p.price)return "";return "-"+Math.round((1-p.price/p.oldPrice)*100)+"%"}
function productCard(p){const s=storeById(p.storeId),fav=state.favorites.includes(p.id);return `<article class="product">${pct(p)?`<span class="disc">${pct(p)}</span>`:""}<button onclick="event.stopPropagation();toggleFav('${p.id}')" style="position:absolute;right:8px;top:8px;z-index:3;border:0;background:#fff;border-radius:50%;width:30px;height:30px">${fav?"♥":"♡"}</button><div onclick="openProduct('${p.id}')"><img src="${p.img}" alt="${esc(p.name)}"><div class="prod-body"><h3>${esc(p.name)}</h3><div><span class="price">${money(p.price)}</span> <span class="old">${money(p.oldPrice)}</span></div><div class="small">${esc(s.name)} · entrega hoje</div></div></div></article>`}
function renderCategories(){const cats=[["Todos","🛍️"],["Moda","👗"],["Calçados","👟"],["Eletrônicos","🎧"],["Beleza","💄"],["Mercado","🛒"]];document.getElementById("categories").innerHTML=cats.map(c=>`<button class="cat" onclick="openCategory('${c[0]}')"><div class="emoji">${c[1]}</div><b>${c[0]}</b></button>`).join("")}
function renderStores(){const html=state.stores.map(s=>`<button class="store-card" onclick="openStore('${s.id}')"><div class="store-logo ${s.id==="tech"?"tech":""}">${s.initials}</div><div style="text-align:left"><b>${esc(s.name)}</b><div class="small"><span class="star">★</span> ${s.rating} · ${esc(s.desc)}</div><div class="small">🚚 Entrega hoje</div></div></button>`).join("");document.getElementById("stores").innerHTML=html;document.getElementById("allStores").innerHTML=html}
function renderHomeProducts(){const q=(document.getElementById("searchInput")?.value||"").toLowerCase();const list=state.products.filter(p=>p.active&&(!q||[p.name,p.category,storeById(p.storeId)?.name].join(" ").toLowerCase().includes(q)));document.getElementById("homeProducts").innerHTML=list.map(productCard).join("")||`<div class="empty">Nenhum produto encontrado.</div>`;updateBadges()}
function openCategory(cat){const list=state.products.filter(p=>p.active&&(cat==="Todos"||p.category===cat));document.getElementById("categoryContent").innerHTML=`<button class="back" onclick="showView('homeView')">← Voltar</button><h2>${cat==="Todos"?"Todos os produtos":esc(cat)}</h2><div class="grid">${list.map(productCard).join("")||'<div class="empty">Nenhum produto nesta categoria.</div>'}</div>`;showView("categoryView")}
function openStore(id){const s=storeById(id),list=state.products.filter(p=>p.storeId===id&&p.active);document.getElementById("storeContent").innerHTML=`<button class="back" onclick="showView('homeView')">← Voltar</button><div class="card row"><div class="store-logo ${id==="tech"?"tech":""}">${s.initials}</div><div style="flex:1"><h2 style="margin:0">${esc(s.name)}</h2><div class="small"><span class="star">★</span> ${s.rating} · ${esc(s.desc)}</div><div class="small">Modalidades: ${s.delivery.map(x=>({pickup:"retirada",store:"entrega da loja",smart:"Smart Shop"}[x])).join(", ")}</div></div></div><div class="grid">${list.map(productCard).join("")}</div>`;showView("storeView")}
function openProduct(id){const p=productById(id),s=storeById(p.storeId);document.getElementById("productContent").innerHTML=`<button class="back" onclick="showView('homeView')">← Voltar</button><div class="card"><div class="detail-img"><img src="${p.img}"></div><h2>${esc(p.name)}</h2><div><span class="price">${money(p.price)}</span> <span class="old">${money(p.oldPrice)}</span></div><div class="small">${esc(s.name)} · estoque ${p.stock}</div><p>${esc(p.desc)}</p><div class="row"><b>Quantidade</b><div class="qty"><button onclick="chgQty(-1)">−</button><span id="qty">1</span><button onclick="chgQty(1)">+</button></div></div><div style="height:10px"></div><button class="btn primary w100" onclick="addToCart('${p.id}')">Adicionar ao carrinho</button><button class="btn blue w100" style="margin-top:8px" onclick="buyNow('${p.id}')">Comprar agora</button></div>`;showView("productView")}function chgQty(d){const e=document.getElementById("qty");e.textContent=Math.max(1,Math.min(20,Number(e.textContent)+d))}
function addToCart(id){const p=productById(id),q=Number(document.getElementById("qty")?.textContent||1);if(state.cart.length&&state.cart[0].storeId!==p.storeId){toast("No MVP, o carrinho aceita produtos de uma única loja.");return}const item=state.cart.find(i=>i.id===id);if(item)item.qty+=q;else state.cart.push({id:p.id,storeId:p.storeId,qty:q});save();updateBadges();toast("Produto adicionado ao carrinho.")}function buyNow(id){addToCart(id);showCart()}function toggleFav(id){state.favorites.includes(id)?state.favorites=state.favorites.filter(x=>x!==id):state.favorites.push(id);save();renderHomeProducts();toast("Favoritos atualizados.")}function updateBadges(){const n=state.cart.reduce((a,i)=>a+i.qty,0);document.getElementById("cartBadge").textContent=n;document.getElementById("cartBadge").style.display=n?"grid":"none"}
function cartTotals(code=""){const subtotal=state.cart.reduce((a,i)=>a+productById(i.id).price*i.qty,0);let discount=0,c=state.coupons[code];if(c&&subtotal>=c.min)discount=subtotal*c.value/100;return{subtotal,discount,total:subtotal-discount}}
function showCart(){const s=state.cart[0]?storeById(state.cart[0].storeId):null,t=cartTotals();document.getElementById("cartContent").innerHTML=`<button class="back" onclick="showView('homeView')">← Continuar comprando</button><h2>Carrinho</h2>${state.cart.length?`<div class="card"><div class="small">Loja: <b>${esc(s.name)}</b></div>${state.cart.map(i=>{const p=productById(i.id);return `<div class="cart-item"><img src="${p.img}"><div><b>${esc(p.name)}</b><div class="small">${money(p.price)} × ${i.qty}</div><div class="actions" style="margin-top:6px"><button class="btn light sm" onclick="cartQty('${i.id}',-1)">−</button><button class="btn light sm" onclick="cartQty('${i.id}',1)">+</button><button class="btn danger sm" onclick="removeCart('${i.id}')">Remover</button></div></div><b>${money(p.price*i.qty)}</b></div>`}).join("")}<hr><div class="row total"><span>Subtotal</span><span>${money(t.subtotal)}</span></div></div><button class="btn primary w100" onclick="openCheckout()">Ir para checkout</button>`:`<div class="card empty">Seu carrinho está vazio.</div>`}`;showView("cartView")}function cartQty(id,d){const i=state.cart.find(x=>x.id===id);i.qty=Math.max(1,i.qty+d);save();showCart()}function removeCart(id){state.cart=state.cart.filter(x=>x.id!==id);save();updateBadges();showCart()}
function openCheckout(){if(!state.cart.length)return;const s=storeById(state.cart[0].storeId);document.getElementById("checkoutContent").innerHTML=`<button class="back" onclick="showCart()">← Voltar ao carrinho</button><h2>Checkout</h2><div class="card form"><label>Endereço de entrega</label><input id="coAddress" value="${esc(state.user.address)}"><label>Cupom</label><input id="coCoupon" placeholder="Ex.: SMART10" oninput="renderCheckoutSummary()"><label>Recebimento</label><select id="coDelivery" onchange="renderCheckoutSummary()">${s.delivery.map(x=>`<option value="${x}">${{pickup:"Retirar na loja • R$ 0,00",store:"Entrega pela loja",smart:"Entrega por parceiro Smart Shop"}[x]}</option>`).join("")}</select><label>Pagamento</label><select id="coPayment"><option>Pix</option><option>Cartão de crédito (simulado)</option></select></div><div id="coSummary"></div><div class="notice">Demonstração: nenhum pagamento real é processado nesta versão.</div><div style="height:10px"></div><button class="btn primary w100" onclick="placeOrder()">Confirmar pedido</button>`;showView("checkoutView");renderCheckoutSummary()}
function renderCheckoutSummary(){const code=(document.getElementById("coCoupon")?.value||"").trim().toUpperCase(),type=document.getElementById("coDelivery")?.value||"pickup";let t=cartTotals(code),freight=type==="pickup"?0:type==="store"?8:12;t.total+=freight;document.getElementById("coSummary").innerHTML=`<div class="card"><div class="row"><span>Produtos</span><b>${money(t.subtotal)}</b></div><div class="row"><span>Desconto</span><b>− ${money(t.discount)}</b></div><div class="row"><span>Frete</span><b>${money(freight)}</b></div><hr><div class="row total"><span>Total</span><span>${money(t.total)}</span></div></div>`}
function placeOrder(){const delivery=document.getElementById("coDelivery").value,code=(document.getElementById("coCoupon").value||"").trim().toUpperCase(),base=cartTotals(code),freight=delivery==="pickup"?0:delivery==="store"?8:12,o={id:"SS"+Date.now().toString().slice(-8),createdAt:new Date().toISOString(),storeId:state.cart[0].storeId,items:state.cart.map(i=>({...i})),subtotal:base.subtotal,discount:base.discount,freight,total:base.total+freight,delivery,payment:document.getElementById("coPayment").value,address:document.getElementById("coAddress").value,status:"Pago / Confirmado",history:[["Pago / Confirmado",new Date().toISOString()]],courierId:null};state.orders.unshift(o);state.cart=[];save();updateBadges();toast("Pedido criado com sucesso.");showView("ordersView")}
function statusClass(s){return s.includes("Entregue")?"s-ok":s.includes("Cancel")?"s-danger":s.includes("entrega")?"s-blue":"s-warn"}function renderOrders(){const box=document.getElementById("ordersContent");box.innerHTML=state.orders.length?state.orders.map(o=>`<div class="card"><div class="row"><div><b>Pedido #${o.id}</b><div class="small">${new Date(o.createdAt).toLocaleString("pt-BR")} · ${esc(storeById(o.storeId).name)}</div></div><span class="status ${statusClass(o.status)}">${esc(o.status)}</span></div><hr>${o.items.map(i=>`<div class="row small"><span>${i.qty}× ${esc(productById(i.id).name)}</span><b>${money(productById(i.id).price*i.qty)}</b></div>`).join("")}<hr><div class="row"><b>Total</b><b>${money(o.total)}</b></div><div class="actions" style="margin-top:10px"><button class="btn light sm" onclick="openOrder('${o.id}')">Acompanhar</button>${!o.status.includes("Entregue")&&!o.status.includes("Cancel")?`<button class="btn danger sm" onclick="requestCancel('${o.id}')">Solicitar cancelamento</button>`:""}<button class="btn light sm" onclick="openSupport('${o.id}')">Ajuda</button></div></div>`).join(""):`<div class="card empty">Você ainda não possui pedidos.</div>`}
function openOrder(id){const o=state.orders.find(x=>x.id===id);openModal(`<h2>Pedido #${o.id}</h2><div class="timeline">${o.history.map(h=>`<div><b>${esc(h[0])}</b><div class="small">${new Date(h[1]).toLocaleString("pt-BR")}</div></div>`).join("")}</div><div class="notice">Modalidade: ${{pickup:"Retirada na loja",store:"Entrega pela loja",smart:"Parceiro Smart Shop"}[o.delivery]}</div>`)}function requestCancel(id){const o=state.orders.find(x=>x.id===id);o.status="Cancelamento solicitado";o.history.push(["Cancelamento solicitado",new Date().toISOString()]);save();renderOrders();toast("Solicitação registrada.")}
function renderAccount(){document.getElementById("accountContent").innerHTML=`<button class="back" onclick="showView('homeView')">← Voltar</button><div class="card row"><div style="width:58px;height:58px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900">JR</div><div><h2 style="margin:0">${esc(state.user.name)}</h2><div class="small">${esc(state.user.email)}</div><div class="small">${esc(state.user.address)}</div></div></div><h3>Minha conta</h3><div class="role-grid"><button class="role" onclick="showFavorites()"><div class="emoji">♥</div><b>Favoritos</b><div class="small">Produtos salvos</div></button><button class="role" onclick="showView('ordersView')"><div class="emoji">▣</div><b>Pedidos</b><div class="small">Histórico e acompanhamento</div></button><button class="role" onclick="merchantEntry()"><div class="emoji">🏪</div><b>Atuar como lojista</b><div class="small">Cadastro e painel</div></button><button class="role" onclick="courierEntry()"><div class="emoji">🛵</div><b>Atuar como entregador</b><div class="small">Cadastro e entregas</div></button><button class="role" onclick="showView('supportView')"><div class="emoji">💬</div><b>Central de ajuda</b><div class="small">Chamados e suporte</div></button><button class="role" onclick="showPolicies()"><div class="emoji">⚖️</div><b>Termos e políticas</b><div class="small">Privacidade, trocas e uso</div></button><button class="role" onclick="showView('adminView')"><div class="emoji">🛡️</div><b>Admin demo</b><div class="small">Governança do marketplace</div></button></div>`}function showFavorites(){const list=state.products.filter(p=>state.favorites.includes(p.id));openModal(`<h2>Favoritos</h2><div class="grid">${list.map(productCard).join("")||'<div class="empty">Nenhum favorito.</div>'}</div>`)}
function merchantEntry(){if(state.merchantApplications.some(a=>a.status==="Aprovado"))showView("merchantView");else openModal(`<h2>Atuar como Lojista</h2><p>Cadastre sua loja para análise.</p><div class="form"><label>Nome da loja</label><input id="mName" value="Minha Loja"><label>Categoria</label><input id="mCat" value="Moda"><label>CPF/CNPJ</label><input id="mDoc"><button class="btn primary w100" style="margin-top:12px" onclick="submitMerchant()">Enviar para análise</button></div>`)}function submitMerchant(){state.merchantApplications.push({id:"MA"+Date.now(),name:document.getElementById("mName").value,category:document.getElementById("mCat").value,status:"Em análise"});save();closeModal();toast("Cadastro de lojista enviado para análise.")}
function courierEntry(){if(state.courierApplications.some(a=>a.status==="Aprovado"))showView("courierView");else openModal(`<h2>Atuar como Entregador</h2><div class="form"><label>Nome</label><input id="cName" value="${esc(state.user.name)}"><label>CPF</label><input id="cCpf"><label>Veículo/modalidade</label><select id="cVehicle"><option>Motocicleta</option><option>Automóvel</option><option>Bicicleta</option></select><button class="btn primary w100" style="margin-top:12px" onclick="submitCourier()">Enviar para análise</button></div>`)}function submitCourier(){state.courierApplications.push({id:"CA"+Date.now(),name:document.getElementById("cName").value,vehicle:document.getElementById("cVehicle").value,status:"Em análise"});save();closeModal();toast("Cadastro de entregador enviado para análise.")}
function renderMerchant(){const my=state.stores[0],orders=state.orders.filter(o=>o.storeId===my.id),sales=orders.filter(o=>!o.status.includes("Cancel")).reduce((a,o)=>a+o.subtotal,0);document.getElementById("merchantContent").innerHTML=`<button class="back" onclick="showView('accountView')">← Conta</button><div class="row"><div><h2 style="margin:0">Painel • ${my.name}</h2><div class="small">Gestão da loja</div></div></div><div class="metric-grid" style="margin-top:12px"><div class="metric"><small>Pedidos</small><strong>${orders.length}</strong></div><div class="metric"><small>Vendas</small><strong>${money(sales)}</strong></div></div><div class="section-head"><h2>Produtos</h2><button class="btn primary sm" onclick="merchantAddProduct()">+ Cadastrar</button></div>${state.products.filter(p=>p.storeId===my.id).map(p=>`<div class="card row"><div><b>${esc(p.name)}</b><div class="small">${money(p.price)} · Estoque ${p.stock} · ${p.active?"Ativo":"Inativo"}</div></div><div class="actions"><button class="btn light sm" onclick="merchantEditProduct('${p.id}')">Editar</button><button class="btn sm ${p.active?"danger":"blue"}" onclick="merchantToggle('${p.id}')">${p.active?"Desativar":"Ativar"}</button></div></div>`).join("")}<div class="section-head"><h2>Pedidos da loja</h2></div>${orders.map(o=>`<div class="card"><div class="row"><b>#${o.id}</b><span class="status ${statusClass(o.status)}">${o.status}</span></div><div class="small">${money(o.total)}</div><div class="actions" style="margin-top:10px"><button class="btn light sm" onclick="merchantStatus('${o.id}','Em preparação')">Em preparação</button><button class="btn light sm" onclick="merchantStatus('${o.id}','Pronto para retirada/coleta')">Pronto</button><button class="btn blue sm" onclick="merchantRequestCourier('${o.id}')">Solicitar entregador</button></div></div>`).join("")||'<div class="card empty">Nenhum pedido ainda.</div>'}`}
function merchantAddProduct(){openModal(`<h2>Novo produto</h2><div class="form"><label>Nome</label><input id="npName"><label>Categoria</label><input id="npCat" value="Moda"><label>Preço</label><input id="npPrice" type="number" step="0.01"><label>Estoque</label><input id="npStock" type="number" value="1"><button class="btn primary w100" style="margin-top:12px" onclick="merchantSaveNew()">Salvar produto</button></div>`)}function merchantSaveNew(){state.products.push({id:"p"+Date.now(),storeId:"bella",name:document.getElementById("npName").value||"Novo produto",category:document.getElementById("npCat").value||"Moda",price:Number(document.getElementById("npPrice").value||0),oldPrice:null,stock:Number(document.getElementById("npStock").value||0),img:IMG.vestido,desc:"Produto cadastrado pelo lojista.",active:true});save();closeModal();renderMerchant();renderHomeProducts();toast("Produto cadastrado.")}
function merchantEditProduct(id){const p=productById(id);openModal(`<h2>Editar produto</h2><div class="form"><label>Nome</label><input id="epName" value="${esc(p.name)}"><label>Preço</label><input id="epPrice" type="number" step="0.01" value="${p.price}"><label>Estoque</label><input id="epStock" type="number" value="${p.stock}"><button class="btn primary w100" style="margin-top:12px" onclick="merchantSaveEdit('${id}')">Salvar</button></div>`)}function merchantSaveEdit(id){const p=productById(id);p.name=document.getElementById("epName").value;p.price=Number(document.getElementById("epPrice").value);p.stock=Number(document.getElementById("epStock").value);save();closeModal();renderMerchant();renderHomeProducts()}function merchantToggle(id){const p=productById(id);p.active=!p.active;save();renderMerchant();renderHomeProducts()}function merchantStatus(id,status){const o=state.orders.find(x=>x.id===id);o.status=status;o.history.push([status,new Date().toISOString()]);save();renderMerchant()}function merchantRequestCourier(id){const o=state.orders.find(x=>x.id===id);if(o.delivery!=="smart"){toast("Este pedido não usa entrega Smart Shop.");return}o.status="Aguardando entregador";o.history.push(["Aguardando entregador",new Date().toISOString()]);save();renderMerchant();toast("Oferta enviada aos parceiros online.")}
function renderCourier(){const offers=state.orders.filter(o=>o.delivery==="smart"&&o.status==="Aguardando entregador"&&!o.courierId);document.getElementById("courierContent").innerHTML=`<button class="back" onclick="showView('accountView')">← Conta</button><div class="row"><div><h2 style="margin:0">Entregador parceiro</h2><div class="small">${state.courier.name}</div></div><button class="btn ${state.courier.online?"blue":"light"} sm" onclick="toggleCourier()">${state.courier.online?"Online":"Offline"}</button></div><div class="metric-grid" style="margin-top:12px"><div class="metric"><small>Saldo liberado</small><strong>${money(state.courier.balance)}</strong></div><div class="metric"><small>Ofertas</small><strong>${offers.length}</strong></div></div><div class="section-head"><h2>Ofertas de entrega</h2></div>${state.courier.online?(offers.map(o=>`<div class="card"><b>${esc(storeById(o.storeId).name)} → ${esc(state.user.city)}</b><div class="small">Distância estimada: 4,2 km · Valor: ${money(o.freight)}</div><div class="notice" style="margin-top:8px">Endereço completo protegido até o aceite.</div><button class="btn primary w100" style="margin-top:10px" onclick="acceptOffer('${o.id}')">Aceitar entrega</button></div>`).join("")||'<div class="card empty">Nenhuma oferta disponível.</div>'):'<div class="card empty">Fique Online para receber ofertas.</div>'}${state.courier.acceptedOffer?courierActiveHtml(state.courier.acceptedOffer):""}`}
function toggleCourier(){state.courier.online=!state.courier.online;save();renderCourier()}function acceptOffer(id){const o=state.orders.find(x=>x.id===id);if(o.courierId){toast("Entrega já aceita.");return}o.courierId="demo";o.status="Entregador designado";o.history.push(["Entregador designado",new Date().toISOString()]);state.courier.acceptedOffer=id;save();renderCourier()}function courierActiveHtml(id){const o=state.orders.find(x=>x.id===id);if(!o)return"";return `<div class="section-head"><h2>Entrega em andamento</h2></div><div class="card"><b>#${o.id}</b><div class="small">Coleta: ${storeById(o.storeId).name}</div><div class="small">Entrega: ${state.user.address}</div><div class="actions" style="margin-top:10px"><button class="btn light sm" onclick="courierStatus('${id}','Pedido coletado')">Pedido coletado</button><button class="btn blue sm" onclick="courierStatus('${id}','Saiu para entrega')">A caminho</button><button class="btn primary sm" onclick="courierComplete('${id}')">Entregue</button></div></div>`}function courierStatus(id,status){const o=state.orders.find(x=>x.id===id);o.status=status;o.history.push([status,new Date().toISOString()]);save();renderCourier()}function courierComplete(id){const o=state.orders.find(x=>x.id===id);o.status="Entregue / Concluído";o.history.push(["Entregue / Concluído",new Date().toISOString()]);state.courier.balance+=o.freight;state.courier.acceptedOffer=null;save();renderCourier()}
function renderAdmin(){const ma=state.merchantApplications,ca=state.courierApplications,gmv=state.orders.reduce((a,o)=>a+o.total,0);document.getElementById("adminContent").innerHTML=`<button class="back" onclick="showView('accountView')">← Conta</button><h2>Admin • Smart Shop</h2><div class="metric-grid"><div class="metric"><small>Lojas</small><strong>${state.stores.length}</strong></div><div class="metric"><small>Pedidos</small><strong>${state.orders.length}</strong></div><div class="metric"><small>GMV</small><strong>${money(gmv)}</strong></div><div class="metric"><small>Comissão</small><strong>10%</strong></div></div><div class="section-head"><h2>Solicitações de lojista</h2></div>${ma.map(a=>approvalCard(a,"merchant")).join("")||'<div class="card empty">Nenhuma solicitação.</div>'}<div class="section-head"><h2>Solicitações de entregador</h2></div>${ca.map(a=>approvalCard(a,"courier")).join("")||'<div class="card empty">Nenhuma solicitação.</div>'}`}function approvalCard(a,type){return `<div class="card"><div class="row"><div><b>${esc(a.name)}</b><div class="small">${esc(a.category||a.vehicle||"")}</div></div><span class="status ${a.status==="Aprovado"?"s-ok":a.status==="Recusado"?"s-danger":"s-warn"}">${a.status}</span></div>${a.status==="Em análise"?`<div class="actions" style="margin-top:10px"><button class="btn blue sm" onclick="approve('${type}','${a.id}',true)">Aprovar</button><button class="btn danger sm" onclick="approve('${type}','${a.id}',false)">Recusar</button></div>`:""}</div>`}function approve(type,id,ok){const arr=type==="merchant"?state.merchantApplications:state.courierApplications,a=arr.find(x=>x.id===id);a.status=ok?"Aprovado":"Recusado";save();renderAdmin()}
function renderSupport(){document.getElementById("supportContent").innerHTML=`<button class="back" onclick="showView('accountView')">← Conta</button><h2>Central de ajuda</h2><div class="card form"><label>Categoria</label><select id="tCat"><option>Pedido</option><option>Pagamento</option><option>Entrega</option><option>Troca/devolução</option><option>Conta</option></select><label>Mensagem</label><textarea id="tMsg"></textarea><button class="btn primary w100" style="margin-top:10px" onclick="submitTicket()">Abrir chamado</button></div>${state.tickets.map(t=>`<div class="card"><div class="row"><b>#${t.id}</b><span class="status s-blue">${t.status}</span></div><div class="small">${esc(t.category)} · ${esc(t.message)}</div></div>`).join("")||'<div class="card empty">Nenhum chamado.</div>'}`}function openSupport(orderId){showView("supportView");setTimeout(()=>document.getElementById("tMsg").value=`Ajuda sobre o pedido #${orderId}: `,50)}function submitTicket(){state.tickets.unshift({id:"T"+Date.now().toString().slice(-6),category:document.getElementById("tCat").value,message:document.getElementById("tMsg").value,status:"Aberto"});save();renderSupport()}
function showPolicies(){openModal(`<h2>Termos e políticas • protótipo</h2><p><b>Trocas e devoluções:</b> fluxo vinculado ao pedido, com motivo e histórico.</p><p><b>Privacidade:</b> dados somente para conta, compra e entrega; endereço completo do cliente protegido antes do aceite do entregador.</p><p><b>Parceiros:</b> lojistas e entregadores dependem de aprovação administrativa.</p><p><b>Pagamento:</b> esta demonstração não processa pagamentos reais.</p><div class="notice">Textos jurídicos finais devem ser revisados antes do lançamento.</div>`)}function openModal(html){document.getElementById("sheet").innerHTML=`<div class="row"><div></div><button class="btn light sm" onclick="closeModal()">Fechar ✕</button></div>${html}`;document.getElementById("modal").classList.add("show")}function closeModal(){document.getElementById("modal").classList.remove("show")}
renderCategories();renderStores();renderHomeProducts();renderAccount();updateBadges();
</script></body></html>
